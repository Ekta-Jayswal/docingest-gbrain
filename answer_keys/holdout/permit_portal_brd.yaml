# Held-out answer key: online building permit BRD (synthetic, Word). Outline from public
# BRD guides (Slite's seven sections plus the functional, data, non-functional, interface
# and glossary sections of common BRD samples). Written from the document alone, before
# the pipeline was run on it. Facts stated only in prose (phases, cost totals) are tested
# through questions, not as entities. Never tune the pipeline against this key.

document: permit_portal_brd.docx
kind: brd
title_contains: Online Building Permit Applications
document_attributes:
  document_id: BRD-PB-2026-04
  version: "1.2"

sections:
  - Preamble
  - Document Information
  - Revision History
  - Executive Summary
  - Project Objectives
  - Project Scope
  - Key Stakeholders
  - Current Process
  - Business Requirements
  - Functional Requirements
  - Applicant
  - Plans Examiner
  - Inspector
  - Business Rules
  - Data Requirements
  - Non-Functional Requirements
  - Security
  - Availability
  - Usability
  - Performance
  - Interface Requirements
  - Project Constraints
  - Assumptions and Dependencies
  - Assumptions
  - Dependencies
  - Cost-Benefit Analysis
  - Glossary
  - Approval

tables:
  - {first_column: Item, becomes: document attributes}
  - {first_column: Version, becomes: document control}
  - {first_column: Name, becomes: "entities: person, stakeholder"}
  - {first_column: ID, becomes: "entities: business_requirement"}
  - {first_column: Rule, becomes: "entities: business_rule"}
  - {first_column: Data, becomes: "entities: data_requirement"}
  - {first_column: Connected system, becomes: "entities: system"}
  - {first_column: Item, becomes: "entities: budget_item"}
  - {first_column: Term, becomes: "entities: glossary_term"}
  - {first_column: Name, becomes: approvals}

entities:
  # Project Objectives: a numbered list without IDs.
  - {key: OBJ-1, type: business_objective, name: Cut the average time from application to decision for residential permits from 41 days to 20 days by December 2027.}
  - {key: OBJ-2, type: business_objective, name: Receive at least 80% of permit applications online within twelve months of launch.}
  - {key: OBJ-3, type: business_objective, name: Remove manual re-keying of application data by counter staff.}
  - {key: OBJ-4, type: business_objective, name: Let applicants book inspections without phoning the office.}
  # Project Scope: "includes" and "does not include" bullet lists.
  - {key: sc-in-1, type: scope_item, name: Online application forms for residential and small commercial building permits, attributes: {scope: in}}
  - {key: sc-in-2, type: scope_item, name: Online payment of permit fees, attributes: {scope: in}}
  - {key: sc-in-3, type: scope_item, name: Electronic plan review with comments returned to the applicant, attributes: {scope: in}}
  - {key: sc-in-4, type: scope_item, name: "Inspection booking, and inspection results recorded in the field", attributes: {scope: in}}
  - {key: sc-out-1, type: scope_item, name: "Planning and zoning applications, which stay on the current process", attributes: {scope: out}}
  - {key: sc-out-2, type: scope_item, name: Changes to the permit fee schedule, attributes: {scope: out}}
  - {key: sc-out-3, type: scope_item, name: Migration of permits closed before 2020, attributes: {scope: out}}
  # Key Stakeholders, Document Information and Approval tables.
  - {key: p-reyes, type: person, name: Thomas Reyes, attributes: {role: Chief Building Official}}
  - {key: p-natarajan, type: person, name: Priya Natarajan, attributes: {role: "Business Analyst, IT Services"}}
  - {key: p-vasquez, type: person, name: Elena Vasquez, attributes: {role: Permit Counter Supervisor, involvement: Reviews forms; daily user}}
  - {key: p-hill, type: person, name: Marcus Hill, attributes: {role: Senior Plans Examiner, involvement: Daily user of plan review}}
  - {key: p-whitfield, type: person, name: Joan Whitfield, attributes: {role: Lead Building Inspector}}
  - {key: p-cole, type: person, name: Sandra Cole, attributes: {title: Director of IT Services}}
  - {key: sh-applicants, type: stakeholder, name: Contractors and homeowners, attributes: {role: Applicants}}
  # Current Process: a numbered list.
  - {key: step-1, type: process_step, name: The applicant collects a paper form from the counter or downloads a PDF.}
  - {key: step-2, type: process_step, name: Counter staff check the form for completeness and take payment by card or cheque.}
  - {key: step-3, type: process_step, name: Counter staff type the application into PermitTrack.}
  - {key: step-4, type: process_step, name: A plans examiner reviews the paper drawings and writes comments on them.}
  - {key: step-5, type: process_step, name: The applicant phones the office to book each inspection.}
  # Business Requirements table.
  - {key: BR-01, type: business_requirement, id: BR-01, attributes: {priority: Must have}}
  - {key: BR-02, type: business_requirement, id: BR-02, attributes: {priority: Must have}}
  - {key: BR-03, type: business_requirement, id: BR-03, attributes: {priority: Must have}}
  - {key: BR-04, type: business_requirement, id: BR-04, attributes: {priority: Must have}}
  - {key: BR-05, type: business_requirement, id: BR-05, attributes: {priority: Nice to have}}
  - {key: BR-06, type: business_requirement, id: BR-06, attributes: {priority: Must have}}
  - {key: BR-07, type: business_requirement, id: BR-07, attributes: {priority: Nice to have}}
  # Functional requirements: bullets that start with their ID, trace in brackets.
  - {key: FR-1.1, type: functional_requirement, id: FR-1.1}
  - {key: FR-1.2, type: functional_requirement, id: FR-1.2}
  - {key: FR-1.3, type: functional_requirement, id: FR-1.3}
  - {key: FR-1.4, type: functional_requirement, id: FR-1.4}
  - {key: FR-1.5, type: functional_requirement, id: FR-1.5}
  - {key: FR-2.1, type: functional_requirement, id: FR-2.1}
  - {key: FR-2.2, type: functional_requirement, id: FR-2.2}
  - {key: FR-2.3, type: functional_requirement, id: FR-2.3}
  - {key: FR-3.1, type: functional_requirement, id: FR-3.1}
  - {key: FR-3.2, type: functional_requirement, id: FR-3.2}
  - {key: FR-3.3, type: functional_requirement, id: FR-3.3}
  - {key: BRL-01, type: business_rule, id: BRL-01}
  - {key: BRL-02, type: business_rule, id: BRL-02}
  - {key: BRL-03, type: business_rule, id: BRL-03}
  # Non-functional requirements: bullets under quality headings.
  - {key: NFR-01, type: nonfunctional_requirement, id: NFR-01}
  - {key: NFR-02, type: nonfunctional_requirement, id: NFR-02}
  - {key: NFR-03, type: nonfunctional_requirement, id: NFR-03}
  - {key: NFR-04, type: nonfunctional_requirement, id: NFR-04}
  - {key: NFR-05, type: nonfunctional_requirement, id: NFR-05}
  - {key: NFR-06, type: nonfunctional_requirement, id: NFR-06}
  # Interface Requirements table.
  - {key: sys-permittrack, type: system, name: PermitTrack, attributes: {direction: Both ways}}
  - {key: sys-citypay, type: system, name: CityPay, attributes: {direction: Outbound}}
  - {key: sys-inspectorgo, type: system, name: InspectorGo, attributes: {direction: Both ways}}
  - {key: sys-parcel, type: system, name: Parcel Registry, attributes: {direction: Inbound}}
  # Project Constraints, Assumptions and Dependencies: bullet lists.
  - {key: con-1, type: constraint, name: Residential permits must be live before the counter lease ends in June 2027.}
  - {key: con-2, type: constraint, name: "The capital budget is capped at $650,000."}
  - {key: con-3, type: constraint, name: PermitTrack stays the system of record and cannot be replaced in this project.}
  - {key: as-1, type: assumption, name: Most applicants have an email address and can scan or photograph their drawings.}
  - {key: as-2, type: assumption, name: The PermitTrack vendor provides an integration interface at no extra cost.}
  - {key: dep-1, type: dependency, name: "The CityPay upgrade to version 4, scheduled by Finance for March 2027."}
  - {key: dep-2, type: dependency, name: Mobile network coverage for inspector tablets in the rural north district.}
  # Cost-Benefit Analysis: the cost rows are budget items; benefit rows are not.
  - {key: cost-licence, type: budget_item, name: "Portal software licence, first three years", attributes: {amount: "180,000"}}
  - {key: cost-services, type: budget_item, name: Implementation and integration services, attributes: {amount: "390,000"}}
  - {key: cost-training, type: budget_item, name: Staff training, attributes: {amount: "35,000"}}
  # Cost-Benefit rows that are benefits: the same type, named by their Item cell.
  - {key: benefit-staff, type: budget_item, name: Counter staff time no longer spent re-keying, attributes: {amount: "95,000 per year"}}
  - {key: benefit-print, type: budget_item, name: Printing and courier of paper drawings, attributes: {amount: "22,000 per year"}}
  # Data Requirements table: one data requirement per row.
  - {key: dr-application, type: data_requirement, name: Permit application, attributes: {source: Applicant, retention: 10 years after final inspection}}
  - {key: dr-drawings, type: data_requirement, name: Drawings, attributes: {source: Applicant, retention: Life of the building}}
  - {key: dr-payment, type: data_requirement, name: Payment record, attributes: {source: CityPay, retention: 7 years}}
  - {key: dr-inspection, type: data_requirement, name: Inspection result, attributes: {source: Inspector, retention: 10 years after final inspection}}
  - {key: gl-examiner, type: glossary_term, name: Plans examiner}
  - {key: gl-record, type: glossary_term, name: Permit record}
  - {key: gl-final, type: glossary_term, name: Final inspection}

