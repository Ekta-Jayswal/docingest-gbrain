  owner: owned_by
  business owner: owned_by
  document owner: owned_by
  sponsor: sponsored_by
  executive sponsor: sponsored_by
  organization: issued_by
  organisation: issued_by
  company: issued_by
  client: has_client
  customer: has_client
  agency: has_client
  vendor: has_vendor
  supplier: has_vendor
  contractor: has_vendor
  service provider: has_vendor

