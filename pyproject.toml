# Code style for docingest: PEP 8 (checked with ruff), 99-character lines as PEP 8
# allows for teams, PEP 257 docstrings on public modules, classes and functions.
#   ruff check .     lint
#   ruff format .    format

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "B", "UP", "SIM", "C4", "D1", "PL"]
ignore = [
    "D105", "D107",   # magic methods and __init__ are covered by the class docstring
    "PLC0415",        # optional heavy parsers (pdfplumber, mammoth, ...) are imported lazily on purpose
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",  # complexity limits
]

[tool.ruff.lint.per-file-ignores]
"tests/helpers/make_sample_documents.py" = ["D1", "E501"]  # sample document text
"tests/*" = ["D1"]  # test method names say what they test
"docingest/reporting/dashboard_page.py" = ["E501"]  # HTML table rows read better on one line
"docingest/evaluation/answer_key_evaluation.py" = ["E501"]  # markdown table rows read better on one line

[tool.ruff.format]
quote-style = "double"
